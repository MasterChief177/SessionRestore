<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>SessionRestore</title>
    <link rel="stylesheet" href="common.css" />
    <link rel="stylesheet" href="popup.css" />
    <script type="module" src="popup.js"></script>
  </head>
  <body>
    <header class="popup-header">
      <img src="../../icons/icon-48.png" alt="" width="28" height="28" />
      <div class="popup-title">
        <h1>SessionRestore</h1>
        <p id="live-count" class="muted">&nbsp;</p>
      </div>
      <button id="open-settings" class="icon" type="button" title="Snapshots &amp; settings" aria-label="Open snapshots and settings"></button>
    </header>

    <form id="save-form" class="save-row">
      <input id="label" type="text" placeholder="Label (optional)" maxlength="120" autocomplete="off" aria-label="Snapshot label" />
      <button type="submit" class="primary">Save now</button>
    </form>

    <section id="last-session" class="last-session" hidden>
      <div>
        <h2>Last session</h2>
        <p id="last-session-meta" class="muted"></p>
      </div>
      <button id="restore-last-session" type="button" class="primary">Restore</button>
    </section>

    <section class="recent">
      <h2>Recent snapshots</h2>
      <ul id="recent" class="recent-list"></ul>
      <p id="recent-empty" class="muted empty" hidden>No snapshots yet. They appear as soon as your tabs change.</p>
    </section>

    <footer class="popup-footer">
      <button id="open-browser" type="button" class="ghost">All snapshots, export &amp; import</button>
    </footer>
  </body>
</html>
